feature: "webhook-e-carne"
current_step: execution
variant: backend
source: "recommended"
source_note: "O pre-refinement de integracao-bancaria-sicoob/v1 recomenda SDD, um ciclo por fatia (§15.2), e a §15.4 posiciona esta como a terceira e ultima. Foi o framework invocado. A ADR pre-requisito da fatia (a 0035, criterio para rota de entrada de fato de terceiro sem sessao) ja estava registrada em 2026-08-18, como o passo 3 da §15.4 exigia."
steps:
  prd:
    status: completed
    summary: "18 US, 21 CA. Receber do provedor a noticia do recebimento sem que a entrada vire autoridade — guardar cru, confirmar de imediato, rotear pela chave que o produto emitiu, derivar a empresa do registro encontrado, conferir o resto, descartar o orfao sem consultar, efeito unico, reter na suspensao — e entregar o carne por contrato e intervalo de competencias, composto sob demanda."
  tech_alignment:
    status: completed
    summary: "6 decisoes tecnicas (D1-D6) e 4 decisoes diretas. Borda: vhost dedicado versionado restrito a um caminho, com verificador em shell. Entrada: fila propria no contrato de @sysloc/shared. Descarte dos 90 dias: expurgo oportunista na tarefa, sem rota nova e sem segundo agendador. Retido de empresa suspensa: desfecho sem tenant no cru + re-roteamento idempotente na reativacao (o cru NAO pode ter empresa_id — a guarda de catalogo-de-plataforma.ts reprova). Carne: pdf-lib introduzido (reserva escrita pela tech-alignment da F3) e composicao em linha reusando BoletoService.entregar. Decisoes diretas: o cru mora no schema plataforma e NAO num schema integracao novo (o roster da ADR-0031 ja nomeia a tabela); rota publicas; efeito so da resposta do provedor; entrega declara midia e nome. Nenhuma candidata a ADR — 0031, 0034 e 0035 ja cobrem o transversal. CORRECAO MEDIDA ao discovery §C1 e ao PRD §9: D23, D24 e D27 NAO disparam com a publicacao restrita ao caminho da noticia."
  tech_spec:
    status: completed
    variant: backend
    summary: "2 rotas novas (POST /v1/notificacoes-bancarias publica, 204 sem corpo; GET /v1/contratos/:codigo/carne). Superficie 99/84 -> 101/86, publicas 19 -> 20, semDeclaracao vazio. Tabela nova plataforma.notificacao_bancaria (sem empresa_id, roster da ADR-0031) com enum de 9 desfechos; funcao SECURITY DEFINER negocio.rotear_notificacao_bancaria sob papel NOLOGIN sysloc_roteamento (emenda da ADR-0024); fila notificacao-bancaria; porta de mesclagem em @sysloc/documentos satisfeita por pdf-lib. Migracoes 0019/0020; renome nosso_numero -> numero_do_titulo_no_provedor (fecha D14). 39 casos de teste (CT-967 a CT-1005). Nenhuma candidata a ADR e nenhum conflito spec x ADR. DOIS ACHADOS DE MEDICAO: a conferencia do identificador do cliente nao tem contra o que comparar (D36 mediu que o produto nao modela a identidade perante o provedor) e vira debito; e o D34 NAO fecha aqui — a noticia nao fornece a chave de correlacao, e o gatilho dele precisa ser emendado."
  validation:
    status: completed
    summary: "challenge-spec: 5 questoes, 12 ajustes inline. (1) CONTRADICAO INTERNA fechada: a camada 3 da idempotencia curto-circuitava por tratado_em nao nulo, e o check da §7.2 da tratado_em ao RETIDO — a noticia retida reenfileirada saia sem efeito e derrubava CA-10/CT-985/CT-986; o discriminador passa a ser o DESFECHO (7 definitivos; RECEBIDO e RETIDO sao pendentes). (2) CONFLITO spec x ADR-0024 declarado: a Decision e o Neutros exigem empresaId na carga da fila e a carga leva so notificacaoId — conformar e impossivel sem violar a clausula de procedencia da propria ADR, entao a conduta e uma TERCEIRA EMENDA a 0024, PRE-CONDICAO DA T1; a §21.5 deixou de afirmar 'conflitos spec x ADR: nenhum', que era falso. (3) O docblock de EmpresaService.reativar declara 'limpa a marca e nada mais... a diferenca entre reativar o acesso e retomar o que estava em curso', e a fatia instala exatamente a segunda coisa: o mesmo diff EMENDA o docblock, sob pena de R3. (4) TERCEIRO RAMO da conferencia: revogarBoleto zera nosso_numero e PRESERVA identificador_no_provedor de proposito ('a chave por onde uma noticia atrasada ainda se liga a esta cobranca'), logo titulo gravado NULO e alcancavel — ele nao confere e nao recusa, segue para a consulta; nasce o CT-1006 (agora 40 casos, CT-967 a CT-1006). (5) Risco R11 + instrucao na §7.3: esta e a PRIMEIRA fatia a declarar tabela em plataforma, entao o drizzle-kit generate vai propor CREATE SCHEMA e a assercao (e) do verificar-migracao.sh reprova. Glossario GLOBAL: 4 termos canonizados (Noticia do provedor, Recebido cru, Identificador da liquidacao, Carne), 4 relacionamentos, 2 ambiguidades resolvidas e a entrada de nosso_numero atualizada. Nenhuma candidata a ADR nova (todas falham em C1)."
  task_plan:
    status: completed
    summary: "12 tasks, 4 fases, 4 paralelizaveis (T1, T2, T4, T5 — lote da Fase 1, exatamente MAX_PARALLEL). US cobertas: 18/18; CA cobertos: 21/21; 40 CTs (CT-967 a CT-1006) distribuidos, cada um em exatamente uma task, persistidos em _run/test-cases.json. Secao 6 gerada por REDISTRIBUICAO da Estrategia de Testes do tech_spec (40 CTs detalhados >= 10) — o agent-spec-qa-test-generator nao foi reinvocado. Fases: (1) fundacao e pre-condicoes — emenda da ADR-0024 (pre-condicao declarada), migracao 0019 com o cru/enums/renome do D14, migracao 0020 com a travessia nominal, dominio puro, e a hipotese do pdf-lib MEDIDA antes de fixar a dependencia (R4); (2) a entrada — rota publica com ancora 100/85, a tarefa partida em T7/T8, e a retencao/reativacao; (3) o carne, fechando a ancora em 101/86 (CT-1004); (4) vhost provado por medicao e o fecho de vocabulario/D38/indice. TRES DECISOES A1 QUE UM LEITOR PRECISA SABER: a tarefa foi PARTIDA EM DUAS (precedente medido: a T4 da fatia (ii) fechou em 5 rodadas / 9 invocacoes de gate); a ancora da superficie sobe DUAS VEZES (99/84 -> 100/85 na T6 -> 101/86 na T10), porque a rule manda a ancora no mesmo diff da publicacao e as duas rotas nascem em tasks distintas; e o CT-990 foi alocado a suite do WORKER e nao a da API, divergindo da §19.3 do tech_spec, porque a §11.6 (operativa) nomeia quatro canais — argumentos, carga da fila, log e mensagem de falha — e a suite da API nao alcanca dois deles. Debitos: fecham D14 (T2), D63 (T6), D5 (T10) e D38 (T12); anotam D58 e D52 (T8); nascem tres (T6, T7, T11); NAO disparam D34, D26, D12, D23, D24 e D27."
  execution:
    status: completed
    tasks_total: 12
    tasks_completed: 12
    summary: "12/12 tasks concluidas, nenhuma bloqueada. Suite 1710 casos verdes nos 9 pacotes, medida pacote a pacote. Superficie publicada fechada em 101 pares / 86 manipuladores, publicas 20, semDeclaracao vazio. 42 debitos anotados (7 MEDIO de categoria anotavel, 35 BAIXO) — nenhum bloqueante. Indice de debitos reconciliado nas duas pontas: 29 pares distintos de marcador contra 29 linhas. PENDENCIA OPERACIONAL DO USUARIO, nao falha medida: verificar-migracao.sh exige sudo e nao foi confirmado nesta sessao; e o rollout da borda em producao (passos 1 a 3 da §3.f da T11) nao foi executado por conformidade com a ADR-0006." 
