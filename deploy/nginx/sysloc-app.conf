# ===========================================================================
# A BORDA PÚBLICA DO APLICATIVO DO CLIENTE — T9 da fatia `publicacao-e-backup`.
#
# Este é o gabarito VERSIONADO do vhost que faz o aplicativo do cliente
# ALCANÇAR o produto. A cópia instalada no servidor de borda é DERIVADA dele por
# `deploy/scripts/borda/instalar-borda-do-app.sh`, que é idempotente (ADR-0005).
# Editar a cópia instalada é perder a alteração na próxima instalação — edite
# AQUI.
#
# ---------------------------------------------------------------------------
# O DEFEITO QUE ESTE ARQUIVO EXISTE PARA FECHAR — medido, não suposto
# ---------------------------------------------------------------------------
#
# Medido antes desta task: o endereço público do aplicativo devolvia
# `200 text/html` para um pedido de DADO — o fallback da página única engolia o
# caminho da API —, enquanto o painel do operador, no MESMO servidor, devolvia
# `401 application/json`. O aplicativo recebia página onde esperava dado.
#
# ⚠️ O QUE GARANTE O REPASSE É O COMPRIMENTO DO PREFIXO — NÃO A ORDEM NO
# ARQUIVO. Entre `location` de prefixo, o nginx escolhe o prefixo MAIS LONGO que
# casa, *independentemente da ordem em que estão listados*, e `/v1/` é mais longo que `/`. A ordem
# em que os blocos aparecem aqui é LEGIBILIDADE, e foi MEDIDA: com o fallback
# declarado ANTES do bloco `/v1/`, numa borda efêmera, `GET /v1/imoveis` seguiu
# devolvendo `200 application/json` e `GET /telas`, `200 text/html`. Trocar os
# dois de lugar não reabre defeito nenhum.
#
# O que REABRE o defeito medido acima são DOIS caminhos, e só eles:
#
#   (1) ESTREITAR OU REMOVER o bloco `location /v1/`. Sem ele, `/` volta a ser o
#       prefixo mais longo que casa e o `try_files … /index.html` engole a API;
#   (2) DECLARAR UMA `location` REGEX que case um caminho sob `/v1/`. Regex vence
#       casamento de prefixo não-ancorado, qualquer que seja o comprimento dele.
#
# As duas são trancadas pelo `CT-1188`, que afirma sobre o arquivo RENDIDO: que
# `/v1/` é declarado como prefixo LITERAL (nunca `= /v1/`, nunca `~ ^/v1/`), e
# que nenhuma `location` regex daqui casa um caminho de API. O `CT-1180` mede o
# efeito por rede E AFIRMA O TIPO DO CONTEÚDO: o estado antigo
# (`200|text/html|`) PASSARIA num teste que olhasse só o código de resposta.
#
# ⚠️ HÁ UMA regex neste arquivo — `~ \.map$` —, e ela SOMBREIA `/v1/*.map`. Isso é
# CONHECIDO, deliberado e asserido: nenhum caminho de API termina em `.map`, e
# não servir mapa de fonte de caminho ALGUM é justamente o que se quer. Ver o
# bloco dela, mais abaixo.
#
# ---------------------------------------------------------------------------
# O CONTRATO MORRE AQUI — nos três endereços, e não na aplicação
# ---------------------------------------------------------------------------
#
# `/docs` (a página), `/docs/json` (o documento) e `/docs-yaml` são recusados
# pela PRÓPRIA borda, sem repasse ao serviço. É o fecho do `D24 · F1/T5`, e o
# gatilho daquele marcador nomeava exatamente esta janela: *"na F7, ao publicar
# atrás do servidor de borda"*.
#
# ⚠️ RESTRINGIR NA APLICAÇÃO SERIA REGRESSÃO DUPLA, e a §5.8 do scope a mede:
#   (1) as 8 rotas `GET /docs*` CONTAM nas 106 da âncora de superfície
#       (`apps/api/test/cobertura-de-autorizacao.e2e.spec.ts`), e removê-las do
#       registro violaria o congelamento da superfície, que é item do marco de
#       entrega;
#   (2) `deploy/scripts/instalacao/verificar-fundacao.sh` consulta `/docs` e
#       `/docs/json` NESSES endereços literais, inclusive na sub-bateria de
#       recuperação após reinício real.
# A aplicação continua registrando os três; a borda é que não os publica. O
# `CT-1182` prova a recusa POR MEDIÇÃO DE REDE, e o `CT-1183` prova que a
# aplicação não perdeu nada.
#
# A recusa é `404`, e não `403`: `403` confirma que o endereço existe.
#
# ---------------------------------------------------------------------------
# O EIXO DE ORIGEM — por que `X-Forwarded-For` é APENSADO, nunca repassado
# ---------------------------------------------------------------------------
#
# Este vhost é a borda MAIS EXTERNA deste hostname: ele termina o TLS e fala
# direto com o cliente, de modo que `$remote_addr` é o endereço observado, e não
# um valor recebido. As duas linhas abaixo são o que sustenta a metade de
# aplicação da ADR-0037, e é o fecho do `D39 · F7/T8`:
#
#   · `X-Real-IP $remote_addr` SOBRESCREVE o que o cliente tenha enviado;
#   · `X-Forwarded-For $proxy_add_x_forwarded_for` APENSA o observado à direita
#     do que veio, e NUNCA repassa a cadeia do cliente intacta.
#
# ⚠️ Repassar sem apensar é PIOR que não declarar salto algum: o termo mais à
# direita passaria a ser escolhido por quem chama, `getIPFromHeader` o adotaria
# como eixo e o teto do limitador viraria evadível por rotação de cabeçalho.
# Antes do eixo existir, a cadeia resolvia para nulo e todos caíam num balde
# único — compartilhado, mas não evadível. O `CT-1187` mede as duas metades com
# cabeçalho FORJADO.
#
# ⚠️ NÃO existe `real_ip_header`/`set_real_ip_from` aqui, e a ausência é
# decisão. Este bloco não tem salto à frente: declarar 127.0.0.1 como salto
# confiável faria o módulo adotar o `X-Forwarded-For` do CLIENTE como
# `$remote_addr`, e o cabeçalho forjado viraria origem aceita com aparência de
# correção — o `Con` que a ADR-0037 nomeia.
#
# ---------------------------------------------------------------------------
# NENHUMA TRADUÇÃO DE ORIGEM — em hipótese alguma
# ---------------------------------------------------------------------------
#
# `Origin` e `Referer` do cliente atravessam INTACTOS. Quem decide qual origem é
# confiável é a aplicação, pela variável `ORIGENS_PUBLICAS` conferida na partida
# (fecho do `D23 · F1/T8`). O paliativo de tradução que existia na borda do
# painel foi REMOVIDO no mesmo diff daquele fecho; reintroduzi-lo aqui criaria a
# segunda cópia do que acabou de ser morto, e a origem pública viraria o endereço
# de escuta ANTES de a aplicação compará-la — quebrando a entrada que hoje
# funciona.
#
# ---------------------------------------------------------------------------
# NENHUMA CREDENCIAL (ADR-0005, condição de entrada)
# ---------------------------------------------------------------------------
#
# Este arquivo não carrega segredo algum: o material do certificado vive fora da
# árvore versionada, e o que entra aqui é o CAMINHO dele, substituído na
# instalação. O hostname também não é literal — ele é decisão operacional do
# usuário e vem de configuração (ver o instalador). O `CT-1188` varre este
# arquivo com controle positivo para afirmar as duas ausências.
#
# ---------------------------------------------------------------------------
# O QUE DELIBERADAMENTE NÃO ESTÁ AQUI
# ---------------------------------------------------------------------------
#
#   · limitador de taxa (`limit_req`/`limit_conn`) — a ADR-0037 é literal: a
#     borda fornece o EIXO de origem e não a política. O teto é decidido na
#     aplicação, por classe de rota, onde a suíte o alcança;
#   · `Strict-Transport-Security` — o efeito é irreversível do lado do
#     navegador pela duração declarada, e a decisão de assumi-lo é do operador
#     que administra o certificado deste hostname, não deste gabarito. A borda
#     do painel, que já opera, também não o emite;
#   · `map` de tradução de origem — ver a seção acima.
#
# ---------------------------------------------------------------------------
# Os marcadores de substituição e quem os troca
# ---------------------------------------------------------------------------
#
#   __HOSTNAME_DO_APP__          hostname público que atende o aplicativo
#   __PORTA_HTTPS__              porta TLS (443 na borda real)
#   __PORTA_HTTP__               porta em claro (80 na borda real)
#   __CERTIFICADO__              caminho do certificado do hostname
#   __CHAVE_DO_CERTIFICADO__     caminho da chave privada do certificado
#   __ENDERECO_DA_API__          `127.0.0.1:<porta>` — a API não escuta fora
#   __RAIZ_DO_APLICATIVO__       diretório da página única já construída
#   __RAIZ_DO_DESAFIO_ACME__     diretório de onde o bloco em claro serve o
#                                desafio de posse do domínio (RFC 8555)
#
# `renderizar_vhost`, no instalador, recusa a instalação se sobrar qualquer
# marcador: gabarito meio substituído é vhost que o nginx aceita e que atende o
# hostname errado. O `CT-1188` o exercita com marcador alfabético, com dígito e
# com valor que quebra a substituição.
# ===========================================================================

server {
	listen __PORTA_HTTPS__ ssl;
	server_name __HOSTNAME_DO_APP__;

	# O material vive fora da árvore versionada; aqui entra só o caminho.
	ssl_certificate __CERTIFICADO__;
	ssl_certificate_key __CHAVE_DO_CERTIFICADO__;

	# TLS 1.2 é o piso. O que está abaixo é o que se quer recusar, e nenhum
	# navegador em uso hoje precisa dele.
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_timeout 10m;

	# A versão do servidor não compõe resposta nenhuma desta borda.
	server_tokens off;

	# Espelha `MAIOR_CORPO_ACEITO` de `apps/api/src/main.ts` (64 KiB). Os dois
	# tetos são conferidos por igualdade no `CT-1188`: uma borda mais apertada
	# que o serviço vira gargalo silencioso, e uma mais larga entrega ao serviço
	# um corpo que ele já vai recusar.
	client_max_body_size 64k;

	# A página única já construída. Nada é gerado aqui.
	root __RAIZ_DO_APLICATIVO__;
	index index.html;

	# -------------------------------------------------------------------
	# O CONTRATO MORRE AQUI — os três endereços, sem repasse ao serviço.
	# `=` é igualdade exata e `^~` é prefixo ANCORADO: juntos alcançam a
	# página, o documento, a versão em YAML e os arquivos que a página
	# carrega (`/docs/swagger-ui-init.js`, `/docs/LICENSE`, …), e NÃO
	# alcançam um caminho de tela que apenas comece com as mesmas letras.
	# Ver a seção do cabeçalho para por que a restrição é aqui.
	# -------------------------------------------------------------------
	location = /docs {
		return 404;
	}

	location ^~ /docs/ {
		return 404;
	}

	location = /docs-yaml {
		return 404;
	}

	# -------------------------------------------------------------------
	# O prefixo de versão. É `/v1/` ser o prefixo MAIS LONGO que casa — e
	# não a posição dele neste arquivo — que impede a chamada de API de cair
	# no fallback da página única; a ordem aqui é legibilidade. Ver o
	# cabeçalho para os DOIS caminhos que de fato reabrem o defeito medido:
	# estreitar este bloco, ou declarar regex que case caminho sob `/v1/`.
	# -------------------------------------------------------------------
	location /v1/ {
		# Sem barra no fim: o caminho original (`/v1/…`) é repassado intacto.
		proxy_pass http://__ENDERECO_DA_API__;
		proxy_http_version 1.1;

		proxy_set_header Host $host;
		# Ver a seção do eixo de origem, no cabeçalho: o primeiro SOBRESCREVE
		# o que o cliente enviou, o segundo APENSA o observado à direita.
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# `Origin` e `Referer` do cliente passam INTACTOS — ver a seção da
		# tradução de origem. NÃO reintroduza `map` nem `proxy_set_header
		# Origin` aqui.

		# A sessão é cookie httpOnly emitido pela aplicação. `Set-Cookie`
		# atravessa intacto, sem `proxy_cookie_domain` nem
		# `proxy_cookie_path`: reescrever domínio ou caminho do cookie de
		# sessão é a forma mais silenciosa de derrubar a entrada.
		proxy_pass_header Set-Cookie;

		# Três linhas, três efeitos distintos — e a razão de cada uma é a
		# dela, não a da vizinha:
		#
		#   · `proxy_buffering off` NÃO governa cache (não há `proxy_cache`
		#     neste vhost, e ela não o criaria nem o impediria). Ela governa
		#     BUFFERIZAÇÃO: os bytes do serviço seguem ao cliente conforme
		#     chegam, sem esperar a resposta inteira nem espelhar em disco.
		#     É o que se quer numa rota que também devolve bytes de PDF
		#     (ADR-0028);
		#   · `proxy_hide_header` DESCARTA o `Cache-Control` que o serviço
		#     tenha emitido. Sem ela, `add_header` ACRESCENTA — a resposta
		#     sairia com DOIS `Cache-Control` no dia em que a aplicação
		#     passasse a emitir o dela, e o intermediário escolheria;
		#   · `add_header ... always` é quem cumpre a promessa: resposta de
		#     sessão não é armazenada, nem por esta borda nem por
		#     intermediário no caminho.
		proxy_buffering off;
		proxy_hide_header Cache-Control;
		add_header Cache-Control "no-store" always;

		# Sem teto, um serviço que trave prende o trabalhador da borda até o
		# sistema desistir. Os valores acompanham os da borda do painel, que
		# já opera: a leitura mais cara do produto é uma listagem paginada.
		proxy_connect_timeout 15s;
		proxy_send_timeout 60s;
		proxy_read_timeout 60s;

		# Nada que venha do serviço pode virar redirecionamento desta borda.
		proxy_redirect off;
	}

	# Fonte da aplicação não é publicada, de caminho ALGUM. É a ÚNICA regex
	# deste vhost, e regex vence casamento de prefixo não-ancorado: ela
	# passa à frente de `/assets/` e TAMBÉM à frente de `/v1/`. O
	# sombreamento de `/v1/*.map` é, portanto, real — e é o que se quer:
	# nenhum caminho de API termina em `.map`, e mapa de fonte não se
	# publica. O `CT-1188` afirma que esta é a única regex e que ela NÃO
	# casa caminho de API; o `CT-1180` e o `CT-1181` medem os dois lados por
	# rede.
	location ~ \.map$ {
		return 404;
	}

	# Assets com hash no nome: imutáveis.
	location /assets/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
	}

	# A página nunca é cacheada — senão o cliente fica preso a um pacote
	# velho e a atualização não alcança quem já entrou.
	location = /index.html {
		add_header Cache-Control "no-store" always;
	}

	# O fallback da página única. Vem por último por LEGIBILIDADE — quem
	# decide que ele não engole `/v1/` é o comprimento do prefixo, e não a
	# posição (ver o cabeçalho).
	location / {
		try_files $uri $uri/ /index.html;
	}
}

server {
	# O bloco em claro existe para (i) servir o desafio de posse do domínio e
	# (ii) mandar o resto para o TLS. Ele NÃO publica o contrato: os três
	# endereços morrem aqui também, e sem `3xx` — um redirecionamento diria
	# que o endereço existe do outro lado.
	listen __PORTA_HTTP__;
	server_name __HOSTNAME_DO_APP__;

	server_tokens off;

	location = /docs {
		return 404;
	}

	location ^~ /docs/ {
		return 404;
	}

	location = /docs-yaml {
		return 404;
	}

	# O desafio de posse do domínio, que o emissor busca SEMPRE em claro
	# (RFC 8555). Sem esta exceção a renovação do certificado desta borda
	# falha EM SILÊNCIO — o certificado simplesmente vence, meses depois.
	# `^~` é prefixo ancorado, não há `proxy_pass` nela, e o que ela casa sai
	# de arquivo estático: nada deste caminho alcança o serviço.
	location ^~ /.well-known/acme-challenge/ {
		root __RAIZ_DO_DESAFIO_ACME__;
		default_type "text/plain";
		autoindex off;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}
