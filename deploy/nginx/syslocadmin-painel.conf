# ===========================================================================
# Borda interna do PAINEL MASTER — syslocadmin.systera.com.br
# ===========================================================================
#
# CÓPIA FIEL de `/opt/web/syslocadmin/nginx/default.conf`, o arquivo que o
# contêiner `syslocadmin-painel` monta em `/etc/nginx/conf.d/default.conf`.
# Versionado em 2026-09-08, por medição: ele era o ÚNICO vhost em uso do produto
# que não existia na árvore — os outros três já viviam aqui —, e numa máquina
# nova teria de ser reescrito à mão, sob pressão, no dia em que o servidor caiu.
#
# ⚠️ O CORPO ABAIXO É BYTE A BYTE O DO ARQUIVO EM USO. Só este cabeçalho foi
# acrescentado, e comentário é inerte para o nginx. Ao alterá-lo, altere os DOIS
# — ou o arquivo versionado passa a descrever uma borda que não existe.
#
# Ele NÃO termina o TLS: quem ocupa 80/443 neste host é o CloudPanel, que
# repassa para `127.0.0.1:8400`. É a mesma topologia de
# `sysloc-app-interno.conf`, e pela mesma razão — ver o cabeçalho daquele.
#
# O contêiner roda em `--network host`, que é a única rede da qual a API,
# escutando só em `127.0.0.1:3000`, é alcançável.
#
# Recriação:
#   docker run -d --name syslocadmin-painel --network host --restart unless-stopped \
#     -v /opt/web/syslocadmin/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro \
#     -v /opt/web/syslocadmin/html:/usr/share/nginx/html:ro \
#     nginx:1.27-alpine
# ===========================================================================

# =============================================================================
# Borda do Painel Master — syslocadmin.systera.com.br
#
# Container `syslocadmin-painel` (imagem nginx:1.27-alpine, --network host).
# Escuta em 127.0.0.1:8400 e é o ALVO do site de proxy reverso do CloudPanel,
# que termina o TLS na porta 443 e repassa para cá.
#
#   navegador --https--> CloudPanel (443) --http--> 127.0.0.1:8400 (este nginx)
#                                                       |
#                                            /v1/ ------+--> 127.0.0.1:3000 (API)
#                                            resto -----+--> /opt/web/syslocadmin/html
#
# POR QUE ESTE ARQUIVO EXISTE: handoff §8 e ADR 0002. A API não publica CORS,
# confere `Origin` e o cookie de sessão é SameSite=Lax — o painel PRECISA ser
# servido na MESMA ORIGEM da API. Este é o equivalente de produção do proxy que
# o vite.config.ts faz em desenvolvimento.
#
# EDITAR AQUI APLICA EM PRODUÇÃO (bind mount de arquivo único). Para aplicar:
#   1. edite /opt/web/syslocadmin/nginx/default.conf
#   2. docker exec syslocadmin-painel nginx -t
#   3. docker restart syslocadmin-painel
# O passo 3 é `restart`, NÃO `nginx -s reload`: o bind mount é de arquivo único,
# então uma cópia que troque o inode deixaria o container na config antiga.
# =============================================================================

# -----------------------------------------------------------------------------
# TRADUÇÃO DE ORIGEM — REMOVIDA em 2026-08-26, com o fechamento do D23 · F1/T8
#
# O que existia aqui: dois `map` que traduziam `Origin`/`Referer` de
# `https://syslocadmin.systera.com.br` para `http://127.0.0.1:3000`, mais as duas
# linhas `proxy_set_header Origin/Referer` do bloco /v1/. O próprio comentário
# daquele bloco se declarava PALIATIVO DE BORDA e mandava removê-lo assim que o
# fecho existisse na aplicação.
#
# O fecho existe: `apps/api/src/configuracao/ambiente.ts` passou a exigir na
# partida a variável `ORIGENS_PUBLICAS` — a LISTA de origens públicas, separada
# por vírgula —, e `apps/api/src/autenticacao/autenticacao.module.ts` a entrega
# ao arcabouço de identidade ACRESCENTANDO-A à origem derivada do endereço de
# escuta. A conferência de origem continua ligada e continua recusando toda
# origem que não esteja na lista; o que sumiu foi a tradução.
#
# POR QUE ELA TINHA DE SAIR NO MESMO PASSO, e não depois: mantê-la duplicaria a
# tradução. A origem pública viraria `http://127.0.0.1:3000` AQUI, antes de a API
# compará-la com a origem pública que ela agora declara — e a entrada no painel,
# que hoje funciona, pararia de funcionar.
#
# ⚠️ ORDEM DE APLICAÇÃO — os três passos, nesta sequência, numa janela só:
#   1. `/etc/sysloc/backend.env` ganha a linha (privilégio; a instalação do zero
#      já a semeia por `deploy/scripts/instalacao/provisionar-base.sh`):
#        ORIGENS_PUBLICAS=https://sysloc.systera.com.br,https://syslocadmin.systera.com.br
#   2. a API nova é implantada e reiniciada — sem a linha do passo 1 ela RECUSA
#      SUBIR, nomeando a variável (é falha fechada, e é deliberada);
#   3. só então `docker exec syslocadmin-painel nginx -t` e
#      `docker restart syslocadmin-painel`, e confere-se a entrada no painel.
#
# Inverter 3 com 1-2 derruba o login do painel na janela entre eles.
# -----------------------------------------------------------------------------

# O esquema real é o do salto da frente (CloudPanel, que termina o TLS). Aqui
# `$scheme` é sempre `http`, e repassá-lo faria a API considerar a requisição
# insegura — o que muda decisão de cookie `Secure`.
map $http_x_forwarded_proto $sysloc_esquema {
    default  $http_x_forwarded_proto;
    ""       $scheme;
}

server {
    listen 127.0.0.1:8400;
    server_name _;

    root /usr/share/nginx/html;   # bind mount de /opt/web/syslocadmin/html
    index index.html;

    # O CloudPanel é o único salto à frente e fala de 127.0.0.1. Sem isto a API
    # veria toda requisição vinda de 127.0.0.1 e qualquer limite por IP passaria
    # a contar o servidor inteiro como um cliente só.
    set_real_ip_from 127.0.0.1;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 10m;

    # Cabeçalho de servidor não anuncia versão.
    server_tokens off;

    # -------------------------------------------------------------------------
    # ⚠️ A ORDEM IMPORTA: /v1/ vem ANTES do fallback da SPA. Invertido, o
    # `try_files ... /index.html` engole as chamadas de API e o painel recebe
    # HTML onde espera JSON. O `./deploy.sh --conferir` detecta esse defeito.
    # -------------------------------------------------------------------------
    location /v1/ {
        # Sem barra no fim: o caminho original (/v1/...) é repassado intacto.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sysloc_esquema;

        # `Origin` e `Referer` do cliente passam INTACTOS: quem decide qual origem
        # é confiável é a API, por `ORIGENS_PUBLICAS` (fecho do D23 · F1/T8). Ver o
        # bloco no topo deste arquivo. NÃO reintroduza tradução aqui.

        # A sessão é cookie httpOnly emitido pela API — Set-Cookie passa intacto,
        # sem proxy_cookie_domain nem proxy_cookie_path.
        proxy_pass_header Set-Cookie;

        # Resposta de sessão nunca é cacheável.
        proxy_buffering off;
        add_header Cache-Control "no-store" always;

        proxy_connect_timeout 15s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Fonte da aplicação não é publicada. Vem antes de /assets/ por ser regex,
    # mas está explícito aqui para quem lê.
    location ~ \.map$ {
        return 404;
    }

    # Assets com hash no nome: imutáveis.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html nunca é cacheado — senão o operador fica preso a um bundle velho.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Eco de diagnóstico: mostra o que a borda REALMENTE recebeu do salto da
    # frente. Existe porque o `--conferir-origem-auth` do deploy.sh é
    # inconclusivo por construção — corpo `{}` é recusado com 422 CAMPO_INVALIDO
    # pelo better-auth ANTES da conferência de origem, medido nesta máquina, e o
    # modo não distingue "origem passou" de "origem foi apagada no caminho".
    # Este eco distingue, sem efeito colateral: devolve apenas os cabeçalhos do
    # próprio requisitante, em texto puro. Nenhum segredo, nenhum estado.
    #
    # ⚠️ O campo `origin-repassado-a-api` SAIU em 2026-08-26, com o fechamento do
    # D23: ele existia para mostrar o resultado da tradução, e não há mais
    # tradução — `Origin` chega à API exatamente como está em `origin-recebido`.
    # Reintroduzi-lo exigiria reintroduzir o `map`, que é o que o fecho removeu.
    location = /_borda/eco {
        access_log off;
        default_type text/plain;
        return 200 "origin-recebido:        $http_origin\nreferer-recebido:       $http_referer\nx-forwarded-proto:      $http_x_forwarded_proto\nhost:                   $host\nip-do-cliente:          $remote_addr\n";
    }

    # Sonda de vida da própria borda, sem tocar na API nem no build.
    location = /_borda/saude {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "borda-do-painel-ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
