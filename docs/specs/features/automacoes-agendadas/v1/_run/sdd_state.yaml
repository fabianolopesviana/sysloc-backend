  tech_spec:
    status: completed
    variant: backend
    summary: >-
      Componentes novos: despachante efêmero (2º ponto de entrada de apps/worker), consumidor único
      das rotinas por empresa, consumidor da manutenção sem tenant, encerramento-de-contratos.ts,
      execucao-de-rotina.ts e o roster publicado em @sysloc/contracts. 1 endpoint novo
      (GET /v1/automacao-de-cobranca/rotinas — a ÚLTIMA rota antes do congelamento; superfície
      105→106 rotas / 90→91 manipuladores, públicas inalteradas em 20). Tabelas: negocio.execucao_de_rotina
      (+ enum negocio.rotina_agendada), migrações 0026 (gerada) e 0027 (autoral, FORCE RLS + política).
      2 filas novas (rotina-agendada, manutencao-do-acervo) + o produtor que faltava para regua-de-cobranca.
      13 unidades systemd (6 timers + 6 oneshot + 1 modelo de alerta). 40 casos de teste (CT-1057 a
      CT-1096), 24/24 CAs cobertos. Nenhuma ADR nova; nenhuma dependência de pacote nova.
    decisoes_a1:
      - "variante = backend (Fronteira do CLAUDE.md; o PRD §4.2 exclui qualquer tela)"
      - "P1 — despachante é o 2º ponto de entrada de apps/worker (dist/despachante.js <rotina>), não app novo"
      - "P2 — registro com colunas fixas + resumo jsonb, não colunas por rotina"
      - "P3 — derivação de 'atrasada' em packages/db/src/execucao-de-rotina.ts, comparação no banco (ADR-0023/0026)"
      - "P4 — encerramento em uma unidade por passagem, FOR UPDATE … SKIP LOCKED; nenhum mecanismo de trava novo"
      - "P5 — vigilância e manutenção são rotinas distintas (cadências opostas)"
      - "retenção dos boletos guardados = 90 dias, uniforme com o histórico e a notícia (reversível por parâmetro)"
      - "RN-02/CA-06 honrada vacuamente: contrato.imovel_id é NOT NULL desde a 0007; prova-se a irrepresentabilidade em vez de relaxar a coluna"
      - "nenhum verificar-*.sh novo — a conformidade das unidades é asserção estática Vitest; evita disparar o D9 · F0/T2"
      - "aprovação do tech_spec assumida como a recomendada (A1), sem pausar"
    debitos:
