feature: "Documentos e confirmação — o contrato em PDF derivado do dado no instante do pedido, e a confirmação do endereço de e-mail do locatário por link que não se forja"
current_step: execution
variant: backend
source: recommended
source_note: "Sub-fatia 2b de 2, e a que FECHA a Fase 3. O pré-refinamento próprio (docs/specs/features/documentos-e-confirmacao/v1/pre-refinement.md) especializa o partilhado de regua-e-documentos/v1 sem sobrescrevê-lo; a §15.2 confirma SDD após medir o brainstorm da sub-fatia isolada, e a §15.4 escreve exatamente este comando — com o path do pré-refinamento junto da descrição — como próximo passo."
steps:
  prd:
    status: completed
    summary: "11 US, 18 CA. Contrato em PDF composto a partir do dado no instante do pedido, sem arquivo armazenado, com marca de cancelamento por composição — fecha o D36 (F2/T8) por construção —, e confirmação do endereço de e-mail do locatário por segredo sorteado, válido por 72h, de uso único e idempotente na reapresentação."
  tech_alignment:
    status: completed
    summary: "8 decisões cravadas (D1 a D8) em checkpoint único com o usuário: @react-pdf/renderer como motor, pacote de domínio próprio no molde de @sysloc/regua, igualdade sobre representação textual intermediária mais um caso que renderiza de fato, migração nova em vez de emenda da 0007, SECURITY DEFINER de superfície mínima para o ato sem sessão, segredo aleatório de 256 bits com SHA-256 indexado, registro próprio do portador com estado derivado do fato, e disparo por fila — este último promovido à ADR-0029."
  tech_spec:
    status: completed
    variant: backend
    summary: "@sysloc/documentos (pacotes 5 → 6, composição pura + porta de renderização), 3 rotas novas (GET /v1/contratos/:codigo/documento em bytes, POST /v1/locatarios/:id/confirmacao-de-email em 202, POST /v1/confirmacoes-de-email como a única @RotaPublica de negócio) levando a superfície de 86/71 a 89/74; tabelas: negocio.portador_de_confirmacao (nova), negocio.locatario (+ email_confirmado_em), negocio.contrato (− pdf_contrato_arquivo); migrações 0013 (domínio, gerada) e 0014 (segurança, autoral, com a função SECURITY DEFINER que resolve o portador); 33 casos de teste (CT-701 a CT-734, 8 unit / 9 integração / 8 E2E / 8 segurança) com 3 provas de falsificação obrigatórias; 7 divergências com veredito escrito ANTES da execução (DV-01 a DV-07); fecha o D36 (F2/T8) por construção."
  validation:
    status: completed
    summary: "challenge-spec: 7 questões, 14 ajustes inline. Achados de maior impacto: (1) o DROP COLUMN de pdf_contrato_arquivo alcança 22 arquivos e a spec declarava 10 — os 12 faltantes entraram na §3.6.1 nova, e a colunaLivre do teste de RLS do contrato em isolamento.spec.ts ficou decidida ANTES da execução (valor_total_contrato + valorDaEscritaCruzada, pelo precedente de contrato_fiador); (2) contradição interna da carga da fila (portadorId em §3.1/§3.6 × segredo em §4.3/§5.1/CT-734) resolvida em favor de segredo; (3) RD-07 disparava em todo PUT e o CT-718 exige o contrário — a condição desceu para o UPDATE por RETURNING OLD./NEW. (PG 18, versão conferida) e o gatilho virou 5º parâmetro opcional do construtor de SuperficieDeCadastro, que serve os três papéis; (4) duas leituras conjuntas de ADR registradas por escrito contra a Decision literal (0028 × o schema do corpo de sucesso; 0027 'uso único' × RN-10), derrubando a afirmação de que nenhum conflito existia; (5) CT-725 fechado nas duas camadas pela forma base64url do digest, que passa pelo esquema. Terminologia canonizada: 4 termos no glossário GLOBAL (Documento do contrato, Marca de cancelamento, Portador de confirmação, Veredito de divergência) e 2 no de FEATURE, novo (Derivado, Representação textual). 1 ADR confirmada para criação (5/5) — pré-requisito do task_plan."
  task_plan:
    status: completed
    summary: "12 tasks, 5 fases, 0 paralelizáveis (flag derivado par a par pela Regra 10d — nenhum par sobrevive às cinco condições; a derivação está na §4.2 do task_plan.md). US cobertas: 11/11, nenhuma órfã. Os 18 CAs cobertos por 33 CTs (CT-701..CT-715, CT-717..CT-734 — o vão do CT-716 é intencional e preservado), cada CT em exatamente uma task, todos vindos de REDISTRIBUIÇÃO do _run/test-cases.json sem reinvocar o agent-spec-qa-test-generator (por isso não há qa_context.md: N=0 subagentes). Fases: 1 A janela que fecha (T1, PRAZO) · 2 O substrato declarado (T2 contrato, T3 esquema+migrações 0013/0014 com o raio de 22 arquivos do DROP COLUMN, T4 o pacote @sysloc/documentos) · 3 O documento (T5 composição+golden, T6 renderizador PDF, T7 a rota de bytes que FECHA o D36) · 4 A confirmação (T8 portas de dados do portador, T9 o disparo por fila, T10 a entrega no worker, T11 o ato sem sessão) · 5 As provas de fecho (T12, superfície 89/74 por dupla medição + isolamento da verificação). model: opus e gates: [qa, tech_review] nas 12; risk: high em seis (T3, T7, T8, T9, T10, T11). Sete achados da derivação na §4.3, entre eles: contrato.service.ts:1196 mapeia o campo removido e é tocado por T3 e T7; três das nove ocorrências em contratos.e2e.spec.ts são edição de DESENHO (o caso que ENVIA o campo é convertido, nunca deletado); packages/shared/test/fila.spec.ts NÃO existe (a §3.4 do tech spec o marca [M], é [N]); e quatro realocações de placement de teste contra o existing_suite do JSON. A fatia emite 1 débito com gatilho (T10) e fecha o D36 (T7), possivelmente também o D13 (T8)."
  execution:
    status: completed
    tasks_total: 12
    tasks_completed: 12
    summary: "CONCLUIDA em 2026-08-13. As 12 tasks aprovadas nos dois gates, nenhuma bloqueada. Entrega o pacote @sysloc/documentos (pacotes 5 -> 6), a tabela negocio.portador_de_confirmacao, a coluna email_confirmado_em, a saida de pdf_contrato_arquivo, as migracoes 0013/0014 e as TRES rotas novas — GET /v1/contratos/:codigo/documento (bytes), POST /v1/locatarios/:id/confirmacao-de-email (o primeiro 202 do produto) e POST /v1/confirmacoes-de-email (a UNICA rota de negocio sem sessao, ADR-0027). Superficie 86/71 -> 89/74, conferida por dupla medicao independente com a igualdade entre os eixos AFIRMADA (CT-732). Suite 1004 -> 1248 casos (1247 verdes; o unico vermelho e o CT-907, flake pre-existente por TIMEOUT), monotonica por pacote. Debitos: fechou o D36 (F2/T8) por construcao na T7 e o D13 (F3/T5) na T8, os dois nas duas pontas; emitiu o D12 (F3/T10) nas duas pontas; conferiu e MANTEVE o D49 e o D57 (este com o gatilho declarado JA DISPARADO, na forma do D28). A ADR-0024 foi EMENDADA (nao superseded) na T11, por escalada do Gate 2 e decisao do usuario: a clausula de exclusividade ficara falsa, e a emenda declara as DUAS leituras legitimas sem contexto mais o discriminador que torna a segunda segura. Tres achados de seguranca pegos por MEDICAO e nao por leitura, todos pelo Gate 2: o segredo do portador vazando para o journal por err.command.args (T9, CRITICO), a renderizacao de ~0,5 s segurando conexao dentro do sql.begin (T7) e o consumo do portador sem reconferir validade (T8). 15 debitos anotados na §2 do run-report."
