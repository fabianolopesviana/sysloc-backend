# ===========================================================================
# A BORDA EXTERNA DA NOTÍCIA BANCÁRIA — T11 da fatia `webhook-e-carne`.
#
# Este é o gabarito VERSIONADO do único vhost que publica o produto para fora.
# A cópia instalada no servidor de borda é DERIVADA dele por
# `deploy/scripts/borda/instalar-borda-de-notificacao.sh`, que é idempotente
# (ADR-0005). Editar a cópia instalada é perder a alteração na próxima
# instalação — edite AQUI.
#
# ---------------------------------------------------------------------------
# POR QUE ESTE ARQUIVO EXISTE, e por que ele publica UM caminho
# ---------------------------------------------------------------------------
#
# Até esta task o produto era inalcançável de fora: nada da API atravessava a
# borda. A ADR-0035 abriu uma exceção estreita — a entrada de FATO DE TERCEIRO,
# que é o aviso do provedor de cobrança — e a exceção só é auditável enquanto o
# que se publica for enumerável. Daí a forma: um `location =` de IGUALDADE
# EXATA, e `404` para todo o resto, respondido pela PRÓPRIA BORDA, sem repasse
# ao serviço.
#
# `location /` (prefixo) publicaria a árvore inteira sob o caminho, e
# `/v1/notificacoes-bancarias/extra` chegaria ao serviço. O `=` é o que torna a
# superfície externa CONTÁVEL, e o `CT-1005` a mede por rede em vez de ler esta
# configuração — `deploy/scripts/borda/verificar-notificacao-bancaria.sh`.
#
# ---------------------------------------------------------------------------
# NENHUM REDIRECIONAMENTO — em hipótese alguma
# ---------------------------------------------------------------------------
#
# O provedor reprova `3xx` no endereço cadastrado, e um `301` sobre um `POST`
# perde método e corpo pelo caminho — que é justamente o dano que esta fatia
# existe para não ter. Por isso o bloco em claro abaixo responde `404` como
# qualquer outro caminho, e NÃO `return 301 https://...`. Quem chegar em claro é
# recusado; quem chega por TLS é atendido. Não acrescente redirecionamento aqui.
#
# ---------------------------------------------------------------------------
# A ÚNICA EXCEÇÃO AO 404 DO BLOCO EM CLARO — o desafio de posse do domínio
# ---------------------------------------------------------------------------
#
# Acrescentada em 2026-08-20, e a razão é MEDIDA, não teórica: esta borda vence
# a disputa de `server_name` da porta 80 do hostname que atende (o servidor de
# borda desta máquina hospeda também o gestor do certificado, e o nginx fica com
# o primeiro vhost carregado). Com o `404` universal abaixo, o desafio em claro
# que o emissor busca — `/.well-known/acme-challenge/<token>`, RFC 8555 — nunca
# alcançava o diretório onde o gestor o escreve, e a RENOVAÇÃO do certificado
# desta borda falhava. Falhava EM SILÊNCIO: o certificado simplesmente vence, o
# provedor para de entregar, e a descoberta vem pela cobrança que não baixou.
#
# A exceção é a mais estreita que resolve, e as três propriedades abaixo são o
# que a mantêm estreita — todas medidas por rede no `CT-1005 (c)`:
#
#   · `^~` é prefixo ANCORADO: não casa `/.well-known/` de nada mais, nem
#     `/.well-known/acme-challenge` sem a barra;
#   · NÃO há `proxy_pass` nela — o desafio sai de arquivo estático, e nenhuma
#     requisição deste caminho alcança o serviço. O invariante que esta borda
#     existe para manter é sobre o que CHEGA À API, e ele segue intacto;
#   · vale só no bloco EM CLARO. Sob TLS o mesmo caminho continua `404`, porque
#     o desafio nunca é buscado por TLS e ampliar a superfície ali seria de graça.
#
# ---------------------------------------------------------------------------
# NENHUMA CREDENCIAL (ADR-0005, condição de entrada)
# ---------------------------------------------------------------------------
#
# Este arquivo não carrega segredo algum: o material do certificado vive fora da
# árvore versionada, e o que entra aqui é o CAMINHO dele, substituído na
# instalação. O hostname também não é literal — ele é decisão operacional do
# usuário e vem de configuração (ver o instalador). O `CT-1005 (a)` varre este
# arquivo com controle positivo para afirmar as duas ausências.
#
# ---------------------------------------------------------------------------
# Os marcadores de substituição e quem os troca
# ---------------------------------------------------------------------------
#
#   __HOSTNAME_DA_NOTIFICACAO__   hostname público que atende a notícia
#   __PORTA_HTTPS__               porta TLS (443 na borda real)
#   __PORTA_HTTP__                porta em claro (80 na borda real)
#   __CERTIFICADO__               caminho do certificado do hostname
#   __CHAVE_DO_CERTIFICADO__      caminho da chave privada do certificado
#   __ENDERECO_DA_API__           `127.0.0.1:<porta>` — a API não escuta fora
#   __RAIZ_DO_DESAFIO_ACME__      diretório de onde o bloco em claro serve o desafio
#                                 de posse do domínio (ver a seção do cabeçalho)
#
# `renderizar_vhost`, no instalador, recusa a instalação se sobrar qualquer
# marcador: gabarito meio substituído é vhost que o nginx aceita e que atende o
# hostname errado.
#
# ---------------------------------------------------------------------------
# DÉBITO COM GATILHO — D27 · F4/T11 · registrado 2026-08-19
# (NÃO é uma `DECISÃO FECHADA`: ele agenda uma mudança, não protege o que está
#  abaixo.)
# O QUÊ: este vhost publica um caminho para fora e NÃO há limitador de abuso
#        nele — nem por origem, nem por taxa. Qualquer um que descubra o
#        hostname pode gravar linhas na tabela do recebido cru.
# QUANDO FECHA: a publicação da API INTEIRA na F7, quando o eixo de origem passa
#        a existir para os débitos D23, D24 e D27 da F1 — hoje nenhum deles tem
#        eixo, e este vhost torna as rotas de sessão inalcançáveis de fora.
# POR QUE NÃO AGORA: o custo por notícia forjada é uma ESCRITA PEQUENA e ZERO
#        consultas ao provedor (a RN-06 descarta o órfão antes de qualquer
#        chamada); e um limitador por endereço de origem faria uma RAJADA
#        LEGÍTIMA do provedor ser descartada — perder notícia é exatamente o
#        dano que a fatia existe para não ter.
# ÍNDICE: docs/specs/features/webhook-e-carne/v1/_run/run-report.md §2, D27
# ---------------------------------------------------------------------------
# ===========================================================================

server {
	listen __PORTA_HTTPS__ ssl;
	server_name __HOSTNAME_DA_NOTIFICACAO__;

	# O material vive fora da árvore versionada; aqui entra só o caminho.
	ssl_certificate __CERTIFICADO__;
	ssl_certificate_key __CHAVE_DO_CERTIFICADO__;

	# TLS 1.2 é o piso: o provedor não fala nada abaixo disso, e o que está
	# abaixo é o que se quer recusar.
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_timeout 10m;

	# A versão do servidor não compõe resposta nenhuma desta borda.
	server_tokens off;

	# Espelha `MAIOR_CORPO_ACEITO` de `apps/api/src/main.ts` (64 KiB). Os dois
	# tetos são conferidos por igualdade no `CT-1005 (a)`: uma borda mais
	# apertada que o serviço vira gargalo silencioso, e uma mais larga entrega
	# ao serviço um corpo que ele já vai recusar.
	client_max_body_size 64k;

	# A ÚNICA coisa que atravessa esta borda. `=` é igualdade exata: nem
	# prefixo, nem sufixo, nem `/extra`.
	location = /v1/notificacoes-bancarias {
		proxy_pass http://__ENDERECO_DA_API__;
		proxy_http_version 1.1;

		# ⚠️ DOS DOIS CABEÇALHOS DE ORIGEM ABAIXO, SÓ UM É CONFIÁVEL — leia antes
		# de consumir qualquer um deles. Esta é a borda MAIS EXTERNA do produto:
		#   · `X-Real-IP $remote_addr` é o endereço do salto imediato, observado
		#     pelo próprio servidor. É o valor CONFIÁVEL.
		#   · `X-Forwarded-For $proxy_add_x_forwarded_for` APENDE ao que o cliente
		#     enviou, de modo que o elemento mais à esquerda fica sob escolha de
		#     quem chama. Chega CONTAMINADO e não serve de eixo de origem.
		# Hoje nenhuma rota os consome — é o que os D23/D24/D27 da F1 registram
		# ao dizer que *"o limitador não tem eixo de origem"*. O consumidor que a
		# publicação da F7 vai escrever herda os dois e precisa escolher o certo;
		# esta nota existe para que ele não escolha o errado por descuido.
		# Registrado no fecho do `D30 · F4/T11` (fatia `webhook-e-carne`), em
		# 2026-08-19. ⚠️ NÃO trocar os cabeçalhos aqui: o eixo de origem é matéria
		# dos D23/D24/D27, cujo gatilho é a publicação na F7, e antecipá-lo aqui
		# desfaria decisão agendada. O que esta task pagou foi o REGISTRO.
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Sem teto, um serviço que trave prende o trabalhador da borda até o
		# sistema desistir. A recepção grava e devolve `204` em milissegundos;
		# estes valores são folgados para ela e curtos para o abuso.
		proxy_connect_timeout 5s;
		proxy_send_timeout 15s;
		proxy_read_timeout 15s;

		# Nada que venha do serviço pode virar redirecionamento aqui.
		proxy_redirect off;

		# ⚠️ O método NÃO é restringido de propósito. A validação de endereço
		# do provedor chega pelo mesmo caminho, e a forma dela é dele, não
		# nossa: um `limit_except POST` transformaria uma sonda de validação em
		# `405` e reprovaria o cadastro. Quem recusa método é o serviço, que
		# conhece o contrato.
	}

	# Todo o resto morre AQUI, sem repasse: `/docs`, `/v1/auth/*`, `/saude` e o
	# que mais a API publique continuam inalcançáveis de fora.
	location / {
		return 404;
	}
}

server {
	# O bloco em claro existe para RECUSAR, não para redirecionar. Ver o
	# cabeçalho: `3xx` sobre `POST` perde método e corpo, e o provedor o reprova.
	listen __PORTA_HTTP__;
	server_name __HOSTNAME_DA_NOTIFICACAO__;

	server_tokens off;

	# A ÚNICA exceção ao 404 deste bloco — ver a seção do cabeçalho. Ela não
	# alcança o serviço, e não cresce: `^~` é prefixo ancorado, e o que ele casa
	# sai de arquivo estático. Sem ela, a renovação do certificado desta borda
	# falha em silêncio.
	location ^~ /.well-known/acme-challenge/ {
		root __RAIZ_DO_DESAFIO_ACME__;
		default_type "text/plain";
		autoindex off;
	}

	location / {
		return 404;
	}
}
