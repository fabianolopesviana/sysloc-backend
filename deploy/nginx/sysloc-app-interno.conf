# =============================================================================
# A BORDA INTERNA DO APLICATIVO DO CLIENTE — sysloc.systera.com.br
#
# Container `sysloc-react-1` (imagem nginx:1.27-alpine, --network host).
# Escuta em 127.0.0.1:8300 e é o ALVO do site de proxy reverso do CloudPanel,
# que termina o TLS na porta 443 e repassa para cá.
#
#   navegador --https--> CloudPanel (443) --http--> 127.0.0.1:8300 (este nginx)
#                                                       |
#                                            /v1/ ------+--> 127.0.0.1:3000 (API)
#                                            resto -----+--> /opt/react/sysloc/html
#
# É o GÊMEO de /opt/web/syslocadmin/nginx/default.conf, que já opera para o
# Painel Master, e o desenho é o mesmo pela mesma razão: a API não publica CORS,
# confere `Origin` e o cookie de sessão é `SameSite=Lax` — o aplicativo PRECISA
# ser servido na MESMA ORIGEM da API.
#
# ---------------------------------------------------------------------------
# POR QUE `--network host`, e não a rede `bridge` que este container usava
# ---------------------------------------------------------------------------
#
# MEDIDO em 2026-09-08: a API escuta em `127.0.0.1:3000` — apenas no laço local
# do host. Um container em `bridge` não a alcança de forma alguma:
#
#   · `proxy_pass http://127.0.0.1:3000` aponta para o laço local DO CONTAINER,
#     onde não há nada escutando;
#   · `host.docker.internal` resolve para o gateway da bridge (172.17.0.1), e a
#     API não escuta nesse endereço.
#
# Era exatamente por isso que o painel do operador funcionava e o aplicativo do
# cliente não, no MESMO servidor: o container do painel sempre foi `--network
# host`. Recriar este em `host` é o que fecha o incidente da religação da borda.
#
# EFEITO COLATERAL DESEJADO: em `bridge` este container publicava
# `0.0.0.0:8300`, e o pacote do aplicativo — que até 2026-09-07 embutia a
# credencial de API do ERPNext — era alcançável da internet por aquela porta.
# Em `host`, escutando `127.0.0.1:8300`, essa superfície deixa de existir.
#
# ---------------------------------------------------------------------------
# ⚠️ A ORDEM NÃO É O QUE PROTEGE — é o COMPRIMENTO DO PREFIXO
# ---------------------------------------------------------------------------
#
# Entre `location` de prefixo, o nginx escolhe o MAIS LONGO que casa,
# independentemente da ordem no arquivo, e `/v1/` é mais longo que `/`. A ordem
# aqui é LEGIBILIDADE. O que de fato reabre o defeito medido (`200 text/html`
# num pedido de dado) são dois caminhos, e só eles:
#
#   (1) ESTREITAR OU REMOVER o bloco `location /v1/`;
#   (2) DECLARAR UMA `location` REGEX que case um caminho sob `/v1/` — regex
#       vence casamento de prefixo não-ancorado, qualquer que seja o tamanho.
#
# ---------------------------------------------------------------------------
# O CONTRATO MORRE AQUI — nos três endereços (fecho do D24 · F1/T5)
# ---------------------------------------------------------------------------
#
# `/docs`, `/docs/json` e `/docs-yaml` são recusados pela PRÓPRIA borda, sem
# repasse à aplicação. Restringir na aplicação seria regressão dupla: as 8 rotas
# `GET /docs*` CONTAM nas 113 da âncora de superfície, e
# `verificar-fundacao.sh` as consulta nesses endereços literais.
#
# A recusa é `404`, e não `403`: `403` confirma que o endereço existe.
#
# ---------------------------------------------------------------------------
# NENHUMA TRADUÇÃO DE ORIGEM — em hipótese alguma
# ---------------------------------------------------------------------------
#
# `Origin` e `Referer` do cliente atravessam INTACTOS. Quem decide qual origem é
# confiável é a aplicação, por `ORIGENS_PUBLICAS` (fecho do D23 · F1/T8), e
# MEDIU-SE em 2026-09-08 que `https://sysloc.systera.com.br` já atravessa e que
# origem de terceiro recebe `403`. Reintroduzir o `map` de tradução que a borda
# do painel teve seria ressuscitar o paliativo que aquele fecho matou.
#
# EDITAR AQUI NÃO APLICA NADA. Este é o gabarito versionado; a cópia viva é
# /opt/react/sysloc/nginx/default.conf, posicionada por
# deploy/scripts/virada/01-religar-borda.sh (idempotente).
# =============================================================================

# O esquema real é o do salto da frente (CloudPanel, que termina o TLS). Aqui
# `$scheme` é sempre `http`, e repassá-lo faria a API considerar a requisição
# insegura — o que muda decisão de cookie `Secure`.
map $http_x_forwarded_proto $sysloc_esquema {
    default  $http_x_forwarded_proto;
    ""       $scheme;
}

server {
    listen 127.0.0.1:8300;
    server_name _;

    root /usr/share/nginx/html;   # bind mount de /opt/react/sysloc/html
    index index.html;

    # O CloudPanel é o único salto à frente e fala de 127.0.0.1. Sem isto a API
    # veria toda requisição vinda de 127.0.0.1 e qualquer limite por IP passaria
    # a contar o servidor inteiro como um cliente só.
    #
    # ⚠️ A borda MAIS EXTERNA (deploy/nginx/sysloc-app.conf) deliberadamente NÃO
    # tem estas três linhas, e a diferença não é descuido: lá não há salto à
    # frente, e declarar um faria cabeçalho forjado virar origem aceita. Aqui há
    # salto, ele é conhecido, e é 127.0.0.1.
    set_real_ip_from 127.0.0.1;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Herdado do vhost anterior deste hostname, e preservado de propósito: o
    # envio de material de certificado do provedor bancário passa por aqui.
    client_max_body_size 50m;

    server_tokens off;

    # -------------------------------------------------------------------------
    # O contrato não é publicado neste hostname.
    # -------------------------------------------------------------------------
    location = /docs {
        return 404;
    }

    location ^~ /docs/ {
        return 404;
    }

    location = /docs-yaml {
        return 404;
    }

    # -------------------------------------------------------------------------
    # O prefixo de versão — o bloco que a religação existe para instalar.
    # -------------------------------------------------------------------------
    location /v1/ {
        # Sem barra no fim: o caminho original (`/v1/…`) é repassado intacto.
        # Acrescentar barra faria o nginx REMOVER o prefixo e a aplicação
        # receberia `/sessao`, que ela não atende.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $sysloc_esquema;

        # `Origin` e `Referer` NÃO são declarados aqui: eles atravessam por
        # omissão, que é o que se quer. Ver a seção da tradução de origem.

        # A sessão é cookie httpOnly emitido pela aplicação. `Set-Cookie`
        # atravessa intacto, sem `proxy_cookie_domain` nem `proxy_cookie_path`:
        # reescrever domínio ou caminho do cookie de sessão é a forma mais
        # silenciosa de derrubar a entrada.
        proxy_pass_header Set-Cookie;

        # `proxy_buffering off` governa BUFFERIZAÇÃO, não cache: os bytes seguem
        # ao cliente conforme chegam, que é o que se quer numa rota que também
        # devolve PDF (ADR-0028). O `proxy_hide_header` DESCARTA o
        # `Cache-Control` da aplicação — sem ele, `add_header` acrescentaria um
        # segundo, e o intermediário escolheria qual obedecer.
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        proxy_connect_timeout 15s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Nada que venha da aplicação vira redirecionamento desta borda.
        proxy_redirect off;
    }

    # Fonte da aplicação não é publicada, de caminho ALGUM. É a ÚNICA regex
    # deste vhost. Ela sombreia `/v1/*.map`, o que é conhecido e desejado:
    # nenhum caminho de API termina em `.map`.
    location ~ \.map$ {
        return 404;
    }

    # Assets com hash no nome: imutáveis. `/static/` é o diretório do Create
    # React App, que é o toolchain MEDIDO deste build (`/static/js/main.<hash>.js`);
    # `/assets/` é o do Vite, e está aqui para o dia em que o toolchain trocar.
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # A página nunca é cacheada — senão o cliente fica preso a um pacote velho e
    # a atualização não alcança quem já entrou.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Eco de diagnóstico: mostra o que esta borda REALMENTE recebeu do salto da
    # frente. Sem efeito colateral, sem segredo, sem estado — devolve apenas os
    # cabeçalhos do próprio requisitante. É o gêmeo do que a borda do painel tem.
    location = /_borda/eco {
        access_log off;
        default_type text/plain;
        return 200 "origin-recebido:        $http_origin\nreferer-recebido:       $http_referer\nx-forwarded-proto:      $http_x_forwarded_proto\nhost:                   $host\nip-do-cliente:          $remote_addr\n";
    }

    # Sonda de vida da própria borda, sem tocar na API nem no build.
    location = /_borda/saude {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "borda-do-app-ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
