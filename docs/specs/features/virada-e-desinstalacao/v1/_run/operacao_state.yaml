    summary: "1/2 — a VIRADA foi executada em 2026-09-08; a DESINSTALACAO nao, e nao tem data. O que a virada entregou, tudo medido: (a) borda do aplicativo religada — `GET /v1/sessao` em sysloc.systera.com.br passou de `200 text/html` para `401 application/json`, com o conteiner `sysloc-react-1` recriado em --network host porque a API escuta so em 127.0.0.1:3000 e rede bridge nao a alcanca; (b) Frappe/ERPNext DESATIVADO por completo — 11 conteineres com restart=no, porta 8200 muda, 6 entradas de cron do root desarmadas, dump de 11 MB preservado fora do Docker; NADA removido, e `02-desativar-legado.sh --reativar` desfaz; (c) envio de e-mail REAL por relay autenticado, com o dominio autenticado no provedor e mensagem entregue pelo adaptador de producao; (d) identificacao da empresa no assunto, na abertura, na assinatura e no Reply-To das duas mensagens do produto (migracao 0028, coluna email_contato); (e) suite de 2138 para 2151 casos, 9 pacotes, todos verdes. ⚠️ ACHADO MAIOR DA SESSAO, e ele nao era da virada: o BACKUP do banco nunca funcionara em producao — falhou todos os dias entre 2026-08-28 e 2026-09-08, e a RESTAURACAO estava quebrada pela mesma causa (papel da aplicacao usado onde e preciso um papel que enxergue e escreva sob RLS forcada). Conceder o GRANT que faltava teria sido a correcao ERRADA: o dump passaria e sairia sem uma linha de negocio. Os dois foram corrigidos e PROVADOS contra o esquema real (34 relacoes, 164 linhas, 3 schemas, 22 politicas de RLS, 3 donos distintos) por `deploy/scripts/virada/08-provar-restauracao.sh`. ⚠️ DUAS premissas do runbook venceram e foram REVOGADAS no mesmo dia, com o texto original preservado: a §3.3 (mandava parar o `sysloc-react-1` chamando-o de app ANTIGO — hoje ele serve o app NOVO, e para-lo tira o produto do ar) e a §3.2 (mandava instalar `sysloc-app.conf`, que foi escrito para ser a borda MAIS EXTERNA e conflita com o CloudPanel, que termina o TLS neste host). ⚠️ O GATE DE DESINSTALACAO DA §4 ESTA FECHADO — 5 de 5, com quatro deles caindo em 2026-09-08: golden files (12), dump da base antiga preservado, checklist de virada executado e conferido, backup do banco novo restaurado em base vazia, e /etc/sysloc/producao criado pelo operador as 14:04. A desinstalacao esta AUTORIZADA e DELIBERADAMENTE NAO EXECUTADA: ela e irreversivel (leva volumes, imagens e a base antiga), enquanto hoje o legado esta desativado e reversivel em dois comandos. O ganho de remove-lo agora sao ~3 GB num volume com 100 GB livres."
